<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon-256.png" />
    <link rel="apple-touch-icon" href="/favicon-256.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3a2130" />

    <title>Luna's Bouquet — Fresh flowers, delivered across Phoenix</title>
    <meta
      name="description"
      content="Large, seasonal flower arrangements for the holidays, plus weddings, events and custom designs. Free delivery across the Phoenix metro, including Scottsdale."
    />

    <!-- What shows when someone shares the site in a text or on social. Without these
         a link preview falls back to a bare URL, which reads like spam. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Luna's Bouquet" />
    <meta property="og:title" content="Luna's Bouquet — Fresh flowers, delivered across Phoenix" />
    <meta
      property="og:description"
      content="Large, seasonal flower arrangements for the holidays, plus weddings, events and custom designs. Free delivery across the Phoenix metro."
    />
    <meta property="og:url" content="https://lunasbouquet.com/" />
    <meta property="og:image" content="https://lunasbouquet.com/media/social-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A Luna's Bouquet arrangement of garden roses in cream, peach and pink" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Tells Google this is a real local florist rather than a generic page. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Florist",
        "name": "Luna's Bouquet",
        "url": "https://lunasbouquet.com/",
        "email": "lunasbouquet.co@gmail.com",
        "areaServed": "Phoenix Metropolitan Area, including Scottsdale",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Phoenix",
          "addressRegion": "AZ",
          "addressCountry": "US"
        },
        "sameAs": ["https://www.instagram.com/lunas_bouquet12"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
